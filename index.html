function offlineText(){if(location.protocol==='file:')return '这是单文件本地版。要添加到 iPad 主屏幕，请使用 HTTPS 安装网址；本地文件的存储能力由打开它的 App 决定。';return offlineReady?'离线资源已备好。建议实际断网再打开一次确认。':swMessage||'正在准备离线资源…';}
function freshItem(skill,phase='practice',baseline=false){if(phase!=='baseline'&&state.lessonReads.some(x=>x.skill===skill&&x.day===C.localDay()))phase='verify';let seed=1,q;const past=state.events.filter(e=>e.skill===skill).slice(-4).map(e=>C.makeQuestion(e.skill,e.seed,e.baseline).prompt),activeQ=question();if(activeQ?.skill===skill)past.push(activeQ.prompt);for(let k=0;k<50;k++){seed=Math.floor(Math.random()*2000000000)+1;q=C.makeQuestion(skill,seed,baseline);if(baseline||!past.includes(q.prompt))break;}return {id:uid(),skill,seed,baseline,phase,draft:{},drawing:[],hints:0,tries:0,eventId:null,feedback:null,seconds:0,finished:false};}
function requestStart(type,ids,part=null){if(state.active){modal('上次探索还在这里',`<p>先继续，或者把已经做过的部分保存下来，再开始新的路线。</p><div class="actions">${button('继续上次','resume','','primary')}${button('保存并结束上次','finish-partial')}</div>`);return;}if(!ids.length){toast('先在设置里选择已经学过的知识点。');return;}
 state.active={id:uid(),type,part,startedAt:new Date().toISOString(),index:0,queue:ids.map(id=>freshItem(id,type==='baseline'?'baseline':C.progress(state,id).overdue?'review':'practice',type==='baseline')),seconds:0,verificationAdded:0};persist();nav('session');}
function startBaseline(part){if(state.baselineDone.includes(part)){toast('这组起点评测已经完成。用换数新题观察进步更准确。');return;}requestStart('baseline',C.skills.slice(part*8,part*8+8).map(s=>s.id),part);}
function sessionView(){if(!state.active||!current()){screen='home';return homeView();}const a=state.active,item=current(),q=question(),s=C.skillMap[q.skill],isBase=a.type==='baseline';let event=state.events.find(e=>e.id===item.eventId);const submitted=isBase&&item.eventId,done=!isBase&&item.feedback==='correct',over=a.seconds>=state.prefs.minutes*60;
 return `<header class="session-head">${button('← 暂停','pause','','quiet')}<div class="meta"><span class="small muted">${isBase?'起点评测':item.phase==='verify'?'换题验证':item.phase==='review'?'隔日回访':'今日探索'} · ${s.island}</span><h2>${s.name}</h2></div><span class="pill">${a.index+1} / ${a.queue.length}</span></header><div class="progress" aria-label="已完成 ${a.index} 题，共 ${a.queue.length} 题"><i style="width:${a.index/a.queue.length*100}%"></i></div>${over?'<div class="tip">已经认真探索了一会儿。做完这题可以休息；下次从这里继续。</div>':''}
 <div class="grid exercise-layout" style="margin-top:22px"><section class="card question-card"><div class="row between"><span class="eyebrow" style="margin:0">${isBase?'先独立试一试':item.phase==='verify'?'换了数字，试试自己的方法':'找到方法，比赶快更重要'}</span>${button('朗读题目','speak','','quiet small')}</div><p class="question">${esc(q.prompt)}</p>${q.model?.type==='area'?modelSVG(q.model,false):''}
 <div id="answer-fields">${q.fields.map(f=>fieldHTML(f,item,submitted||done)).join('')}</div><p class="small muted">分数写成 3/4；带分数可写 1又1/2 或 3/2。键盘和下方数字键都能用。</p><div class="keypad" aria-label="数学输入键">${['7','8','9','/','⌫','4','5','6','又','清空','1','2','3',',','−','0','.','下一格'].map(k=>button(k,'key',`data-key="${k}" ${submitted||done?'disabled':''}`)).join('')}</div><div id="format-error" class="error-text" role="alert"></div>
 ${submitted?`<div class="feedback neutral"><h3>已经记下你的想法</h3><p>这组做完后，再一起看哪些方法可以巩固。</p></div><div class="actions">${button(a.index===a.queue.length-1?'看看这组发现':'下一题 →','next','','primary')}</div>`:done?`<div class="feedback"><h3>${event?.independent?'这次独立完成了':'这一步已经走通了'}</h3><p>${esc(q.check)}</p><p class="small">${event?.independent?(item.phase==='verify'?'新题也完成了。过几天再看看是否还记得。':'先留下这次发现，之后会安排隔日回访。'):'首次尝试与新题验证会分开记录；过几天再来看看是否还记得。'}</p></div><div class="actions">${button('继续 →','next','','primary')}${button('今天先到这里','finish-partial')}</div>`:`<div class="actions">${button(isBase?'记录答案，继续':'检查我的答案','check','','primary')}${!isBase?button(item.hints?'再给我一点提示':'给我一个提示','hint'):''}</div><div class="row" style="margin-top:12px">${button('暂时不会','unknown','','quiet small')}${button('还没学过','unlearned','','quiet small')}</div>`}
 ${item.feedback==='wrong'?`<div class="feedback help" role="status"><h3>有一步值得再看一眼</h3><p>${esc(mistakeMessage(q,item))}</p><div class="actions">${button('分步讲一讲','explain','','secondary')}${button('再检查修改后的答案','check')}</div></div>`:''}
 ${!isBase&&item.hints>0&&item.hints<3?`<div class="hint-card"><strong>小线索 ${item.hints}</strong><p>${esc(q.hints[Math.min(item.hints-1,q.hints.length-1)])}</p><span class="small muted">用了线索也没关系，这次会记为“借助提示”。</span></div>`:''}
 ${!isBase&&item.hints>=3?`<div class="lesson-card card" style="margin-top:17px"><h3>一起走三步</h3><ol class="lesson-steps">${q.steps.map(t=>`<li>${esc(t)}</li>`).join('')}</ol><p>${esc(q.check)}</p>${button(item.phase==='verify'?'记下方法，结束本题':'我看懂了，去做新题','next-assisted','','primary')}</div>`:''}</section>
 <aside class="side-stack"><section class="card lesson-card"><h3>${isBase?'先保留自己的想法':'今天练的检查动作'}</h3><p>${isBase?'可以在下方打草稿。先按自己的理解完成，系统会在这组结束后给出讲解。':'做完后，先读回题目，再检查最容易错的一步，最后试着估计或代回。'}</p>${!isBase&&item.phase==='verify'?'<p class="small">这道是新数字；刚看过讲解后的成功，会与隔日回访分开记录。</p>':''}<span class="pill">不会也可以留下一个尝试</span></section>
 <section class="card scratch"><div class="scratch-head"><h3>我的草稿</h3><div class="row" style="gap:4px">${button('撤销','undo')}${button('清空','clear-drawing')}</div></div><canvas id="scratch" aria-label="可用 Apple Pencil 或手指书写的草稿区域"></canvas><div class="row between"><label class="inline-checkbox"><input type="checkbox" id="pen-only" ${state.prefs.penOnly?'checked':''}>只用 Pencil 写</label><span class="small muted">草稿已随题保存</span></div><p class="small muted">在草稿区外滑动页面。系统核验输入答案，草稿留作自己回看。</p></section></aside></div>`;
}
function fieldHTML(f,item,disabled){const value=item.draft[f.id]??'';return `<div class="field"><div class="field-label" id="label-${f.id}">${esc(f.label)}</div>${f.type==='choice'?`<div class="choices" role="group" aria-labelledby="label-${f.id}">${f.options.map((opt,i)=>`<button class="choice" data-action="choose" data-field="${f.id}" data-value="${i}" aria-pressed="${String(value)===String(i)}" ${disabled?'disabled':''}><span class="radio">${String(value)===String(i)?'✓':''}</span><span>${esc(opt)}</span></button>`).join('')}</div>`:`<input class="answer-input ${focusField===f.id?'active':''}" id="answer-${f.id}" data-answer="${f.id}" aria-labelledby="label-${f.id}" value="${esc(value)}" inputmode="text" autocomplete="off" autocorrect="off" spellcheck="false" maxlength="200" ${disabled?'disabled':''}>`}</div>`;}
function mistakeMessage(q,item){const result=C.evaluate(q,item.draft),bad=result.fields.filter(f=>!f.correct);if(bad.length===1&&bad[0].id==='reason')return '计算结果已经对了。再读一读理由：哪一个真正说明了为什么要这样算？';const value=item.draft.value;return q.wrong[value]||q.hints[0];}
function syncDraft(){if(!current())return;document.querySelectorAll('[data-answer]').forEach(el=>current().draft[el.dataset.answer]=el.value);}
function record(outcome,result){const a=state.active,item=current();let e=state.events.find(e=>e.id===item.eventId);if(!e){e={id:item.id,sessionId:a.id,skill:item.skill,seed:item.seed,baseline:item.baseline,at:new Date().toISOString(),day:C.localDay(),outcome,phase:item.phase,answers:{...item.draft},firstCorrect:!!result?.correct,independent:outcome==='answered'&&!!result?.correct&&item.hints===0&&item.phase!=='verify',finalCorrect:!!result?.correct,hints:item.hints,tries:1,seconds:Math.round(item.seconds),drawing:item.drawing};state.events.push(e);item.eventId=e.id;}else{e.tries++;e.finalCorrect=!!result?.correct;e.finalAnswers={...item.draft};e.hints=Math.max(e.hints,item.hints);e.drawing=item.drawing;e.seconds=Math.round(item.seconds);}item.tries++;return e;}
function updateHintRecord(){const e=state.events.find(e=>e.id===current()?.eventId);if(e)e.hints=Math.max(e.hints,current().hints);}
function check(){if(!current())return;tick();syncDraft();const a=state.active,item=current(),q=question();if((a.type==='baseline'&&item.eventId)||item.feedback==='correct')return;const result=C.evaluate(q,item.draft);if(!result.valid){$('format-error').textContent='还有一格没填好，或格式无法识别。请填写结果；多个答案用逗号分开。这次还不算一次尝试。';return;}record('answered',result);item.feedback=a.type==='baseline'?'saved':result.correct?'correct':'wrong';persist();if(a.type==='baseline')next();else render();}
function skip(outcome){if(!current())return;if(state.active.type==='baseline'&&current().eventId){next();return;}syncDraft();const e=record(outcome,null);if(outcome==='unlearned'){e.outcome='unlearned';e.firstCorrect=false;e.independent=false;e.finalCorrect=false;state.prefs.enabled=state.prefs.enabled.filter(x=>x!==current().skill);}persist();next();}
function addVerification(item){const a=state.active,e=state.events.find(x=>x.id===item.eventId);if(a.type!=='baseline'&&item.phase!=='verify'&&e&&e.outcome!=='unlearned'&&!e.independent&&a.verificationAdded<2){a.queue.splice(a.index+1,0,freshItem(item.skill,'verify'));a.verificationAdded++;}}
function next(){if(!state.active||!current())return;tick();const item=current();if(!item.eventId){toast('先留下一个答案，或选择“暂时不会”。');return;}const saved=state.events.find(e=>e.id===item.eventId);if(saved){saved.drawing=item.drawing;saved.seconds=Math.round(item.seconds);}addVerification(item);item.finished=true;state.active.index++;focusField=null;if(state.active.index>=state.active.queue.length){finish(false);return;}persist();render();window.scrollTo({top:0,behavior:'instant'});}
function finish(partial=false){if(!state.active)return;tick();const a=state.active,eventIds=state.events.filter(e=>e.sessionId===a.id).map(e=>e.id);if(!eventIds.length){state.active=null;persist();nav('home');return;}const s={id:a.id,at:new Date().toISOString(),type:a.type,eventIds,seconds:Math.round(a.seconds),partial};state.sessions.push(s);if(a.type==='baseline'&&!partial&&a.index>=a.queue.length)state.baselineDone=[...new Set([...state.baselineDone,a.part])];lastReport=s;state.active=null;persist();nav('summary');}
function summaryView(){const s=lastReport||state.sessions.at(-1);if(!s)return homeView();const ev=state.events.filter(e=>s.eventIds.includes(e.id)),tried=ev.filter(e=>e.outcome!=='unlearned'&&e.phase!=='verify'),ind=tried.filter(e=>e.independent).length;return `<section class="hero"><div class="hero-copy"><div class="eyebrow">这一站的发现</div><h1>今天走过的路，<br>已经记下来了。</h1><p>${s.partial?'已完成的部分已保存，没做的题不算错。':'有些方法已经会用，有些还值得再看一步。'}<br>休息也属于学习的一部分。</p><div class="scoreline"><div class="stat"><strong>${tried.length?`${ind}/${tried.length}`:'—'}</strong><span>首次独立正确 / 已尝试</span></div><div class="stat"><strong>${tried.filter(e=>!e.independent&&e.finalCorrect).length}</strong><span>借助反馈后完成</span></div></div><p class="small muted">当日新题验证：${ev.filter(e=>e.phase==='verify'&&e.firstCorrect).length} / ${ev.filter(e=>e.phase==='verify'&&e.outcome!=='unlearned').length} 首次正确，单独记录。</p>${button('今天先到这里','nav','data-to="home"','primary')}</div>${heroArt()}</section><section class="card"><h2>带走这些小发现</h2>${ev.map(e=>`<div class="task"><div class="task-icon">${e.independent?'✓':e.outcome==='unlearned'?'○':'↗'}</div><div class="task-copy"><strong>${C.skillMap[e.skill].name}</strong><small>${outcomeText(e)}${e.phase==='verify'?' · 当日新题验证':''}${e.finalCorrect&&!e.firstCorrect?' · 后来已完成':''}</small></div>${button('看讲解','review-event',`data-id="${esc(e.id)}"`,'small')}</div>`).join('')}<p class="small muted" style="margin-top:18px">系统会优先安排需要回访的内容。今天的新题成功，不等同于已经长期掌握。</p></section><div class="actions">${button('去花园看看','nav','data-to="garden"','secondary')}${button('保存记录备份','export')}</div>`;}
function lessonView(){const s=C.skillMap[selectedSkill]||C.skills[0],q=C.makeQuestion(s.id,101,true);return `<div class="row between">${button('← 回地图','nav','data-to="map"','quiet')}<span class="pill">${s.island}</span></div><div class="grid two" style="margin-top:20px"><section class="card"><div class="eyebrow">一张小讲解卡</div><h1 style="font-size:33px">${s.name}</h1><p class="question">${esc(q.prompt)}</p>${q.model?modelSVG(q.model,true):''}<ol class="lesson-steps">${q.steps.map(t=>`<li>${esc(t)}</li>`).join('')}</ol><div class="tip">检查：${esc(q.check)}</div><div class="actions">${button('换数字，自己试一题','practice',`data-skill="${s.id}"`,'primary')}${button('听一听','speak-lesson',`data-skill="${s.id}"`)}</div></section><section class="card"><h2>怎么知道自己会了？</h2><ol class="lesson-steps"><li>合上讲解，试一道换数字的题。</li><li>说清楚为什么这样算。可以先自己说，系统不录音。</li><li>隔几天再做一次，看方法是否还记得。</li></ol><p>这里只展示一个例子；练习会换数字。遇到不懂的地方，可以拿一个具体步骤去问老师。</p>${button('打开概念实验室','nav','data-to="lab"','secondary')}</section></div>`;}
function modelSVG(m,solution){if(m.type==='area'){return `<svg class="math-svg" viewBox="0 0 350 230" role="img" aria-label="一个正方形，三角形的底是整条底边，高是边长的 ${1}/${m.n}"><rect x="70" y="20" width="180" height="180" fill="#edf4e6" stroke="#577d70" stroke-width="2"/><polygon points="70,200 250,200 160,${200-180/m.n}" fill="#efbd70" stroke="#aa792f" stroke-width="2"/><path d="M160 ${200-180/m.n}V200" stroke="#56766c" stroke-dasharray="5 4"/><text x="178" y="${200-90/m.n}">高 = 边长 / ${m.n}</text><text x="110" y="223">底：整条边长</text>${solution?`<text x="82" y="45">底 × 高 ÷ 2</text>`:''}</svg>`;}
 if(m.type==='fraction'){const x=30,w=290/m.d;return `<svg class="math-svg" viewBox="0 0 350 120" role="img" aria-label="把一个整体分成 ${m.d} 份，其中 ${m.n} 份涂色">${Array.from({length:m.d},(_,i)=>`<rect x="${x+i*w}" y="25" width="${w}" height="48" fill="${i<m.n?'#73b1a0':'#f5f3e8'}" stroke="#46786d"/>`).join('')}<text x="90" y="102">${m.d} 份为一个整体，取其中 ${m.n} 份</text></svg>`;}
 if(m.type==='units')return `<svg class="math-svg" viewBox="0 0 350 220" role="img" aria-label="边长为100厘米的正方形"><rect x="80" y="20" width="170" height="170" fill="#e7f2df" stroke="#577d70" stroke-width="2"/>${Array.from({length:9},(_,i)=>`<path d="M${97+i*17} 20V190M80 ${37+i*17}H250" stroke="#a6c1a0"/>`).join('')}<text x="120" y="212">100 厘米</text><text x="265" y="106">100</text><text x="265" y="129">厘米</text><text x="99" y="100">100 × 100</text><text x="90" y="126">= 10000 平方厘米</text></svg>`;
 if(m.type==='interval'){const c=C.lcm(m.a,m.b);return `<svg class="math-svg" viewBox="0 0 400 140" role="img" aria-label="包含起点和终点的共同标记示意"><path d="M28 63H370" stroke="#9eb7a2" stroke-width="5"/>${Array.from({length:m.n+1},(_,i)=>{const x=28+i*342/m.n;return `<circle cx="${x}" cy="63" r="7" fill="#1d786b"/><text x="${x}" y="96" text-anchor="middle">${i*c}</text>`;}).join('')}<text x="123" y="130">每个点都要数到，包含 0 米</text></svg>`;}
 if(m.type==='factors')return `<div class="tip">两数是 ${m.a} 与 ${m.b}。<br>公因数：能整除它们。<br>公倍数：能被它们整除。</div>`;
 return '';}
function labView(){let visual,controls,copy;
 if(lab.type==='fraction'){visual=modelSVG({type:'fraction',n:lab.n,d:lab.d},true);controls=`<div class="lab-controls">${button('−','lab-change','data-what="d" data-delta="-1"')}<strong>分 ${lab.d} 份</strong>${button('+','lab-change','data-what="d" data-delta="1"')}</div><div class="lab-controls">${button('−','lab-change','data-what="n" data-delta="-1"')}<strong>取 ${lab.n} 份</strong>${button('+','lab-change','data-what="n" data-delta="1"')}</div>`;copy=`同一个整体，${lab.n}/${lab.d}=${C.fmt(C.rat(lab.n,lab.d))}。分母告诉我们分成几份，分子告诉我们取几份。`;}
 else if(lab.type==='area'){visual=modelSVG({type:'area',n:lab.d},lab.guides);controls=`<div class="lab-controls">${[2,3,4].map(x=>button(`高是 1/${x}`,'lab-height',`data-n="${x}"`,lab.d===x?'secondary':'')).join('')}${button(lab.guides?'收起结论':'看看面积关系','lab-guides')}</div>`;copy=lab.guides?`三角形占整个正方形的 1/${2*lab.d}。同底同高的长方形还要取一半。`:'先猜一猜：三角形占正方形的几分之几？再打开结论验证。';}
 else{visual=modelSVG({type:'interval',a:8,b:12,n:lab.stations,length:24*lab.stations},true);controls=`<div class="lab-controls">${[3,4,5].map(n=>button(`路长 ${24*n} 米`,'lab-stations',`data-n="${n}"`,lab.stations===n?'secondary':'')).join('')}</div>`;copy=`8 和 12 的共同站点每隔 24 米出现一次。从 0 米到 ${24*lab.stations} 米：${lab.stations} 段，却有 ${lab.stations+1} 个点。试着改变路长，看看起点是否总要多算一个。`;}
 return `<div class="lab"><div class="eyebrow">不计分的概念实验室</div><h1>动一动，让关系看得见</h1><div class="lab-tabs">${[['fraction','分数条'],['area','三角形'],['interval','标记小路']].map(([id,t])=>button(t,'lab-tab',`data-tab="${id}"`,lab.type===id?'selected':'')).join('')}</div><section class="card"><div class="lab-visual">${visual}</div>${controls}<p class="tip" aria-live="polite">${copy}</p><div class="actions">${button('试一道对应的新题','practice',`data-skill="${{fraction:'equivalent',area:'area',interval:'interval'}[lab.type]}"`,'primary')}${button('回地图','nav','data-to="map"')}</div></section></div>`;}
let canvasCtx=null,canvasEl=null,stroke=null,canvasObserver=null;
function bindCanvas(){if(canvasObserver)canvasObserver.disconnect();canvasEl=$('scratch');if(!canvasEl)return;canvasCtx=canvasEl.getContext('2d');const resize=()=>{const rect=canvasEl.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,3);canvasEl.width=Math.round(rect.width*dpr);canvasEl.height=Math.round(rect.height*dpr);canvasCtx.setTransform(dpr,0,0,dpr,0,0);redraw();};canvasObserver=new ResizeObserver(resize);canvasObserver.observe(canvasEl);resize();
 const point=e=>{const r=canvasEl.getBoundingClientRect();return [Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))];};
 canvasEl.onpointerdown=e=>{if(state.prefs.penOnly&&e.pointerType!=='pen')return;if(e.button!==0)return;e.preventDefault();canvasEl.setPointerCapture(e.pointerId);stroke=[point(e)];current().drawing.push(stroke);redraw();};
 canvasEl.onpointermove=e=>{if(!stroke)return;e.preventDefault();const p=point(e),last=stroke.at(-1);if(Math.abs(p[0]-last[0])+Math.abs(p[1]-last[1])>.003){if(stroke.length<1500)stroke.push(p);redraw();}};
 const end=()=>{if(stroke){stroke=null;const e=state.events.find(e=>e.id===current()?.eventId);if(e)e.drawing=current().drawing;persist();}};canvasEl.onpointerup=end;canvasEl.onpointercancel=end;
 $('pen-only').onchange=e=>{state.prefs.penOnly=e.target.checked;persist();};}
function redraw(){if(!canvasCtx||!canvasEl)return;const r=canvasEl.getBoundingClientRect();canvasCtx.clearRect(0,0,r.width,r.height);canvasCtx.strokeStyle='#254d62';canvasCtx.fillStyle='#254d62';canvasCtx.lineWidth=2.2;canvasCtx.lineCap='round';canvasCtx.lineJoin='round';for(const s of current()?.drawing||[]){if(!s.length)continue;canvasCtx.beginPath();canvasCtx.moveTo(s[0][0]*r.width,s[0][1]*r.height);for(const p of s.slice(1))canvasCtx.lineTo(p[0]*r.width,p[1]*r.height);if(s.length===1){canvasCtx.arc(s[0][0]*r.width,s[0][1]*r.height,1.3,0,Math.PI*2);canvasCtx.fill();}else canvasCtx.stroke();}}
function drawingSVG(drawing){if(!Array.isArray(drawing)||!drawing.length)return '';return `<svg viewBox="0 0 500 270" class="math-svg" role="img" aria-label="当时保存的草稿"><rect width="500" height="270" fill="#f7f9ef"/>${drawing.map(s=>`<polyline points="${s.map(p=>`${Number(p[0])*500},${Number(p[1])*270}`).join(' ')}" fill="none" stroke="#254d62" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`).join('')}</svg>`;}
function markLesson(skill){if(!state.lessonReads.some(x=>x.skill===skill&&x.day===C.localDay()))state.lessonReads.push({skill,day:C.localDay()});persist();}
function eventModal(id){const e=state.events.find(e=>e.id===id);if(!e)return;const q=C.makeQuestion(e.skill,e.seed,e.baseline);markLesson(e.skill);modal(C.skillMap[e.skill].name,`<span class="pill">${esc(e.day)} · ${outcomeText(e)}</span><p class="question" style="font-size:21px">${esc(q.prompt)}</p><h3>当时的首次答案</h3><div class="saved-answer">${q.fields.map(f=>`${esc(f.label)}：${esc(f.type==='choice'?f.options[e.answers[f.id]]||'未选择':e.answers[f.id]||'未填写')}`).join('<br>')}</div>${drawingSVG(e.drawing)}<h3 style="margin-top:22px">一起回看方法</h3><ol class="lesson-steps">${q.steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol><div class="tip">${esc(q.check)}</div><p class="small muted">首次答案保留不覆盖。${e.finalCorrect?'这题后来完成了。':'下一次用新题再验证。'}${e.phase==='verify'?' 本题属于当日换题验证。':''}</p><div class="actions">${button('换一道自己试试','practice',`data-skill="${e.skill}"`,'primary')}${button('关闭','close-modal')}</div>`);}
function tick(){const now=Date.now(),delta=Math.min((now-lastTick)/1000,5);lastTick=now;if(!document.hidden&&screen==='session'&&state.active&&current()){state.active.seconds+=delta;current().seconds+=delta;}}
function download(name,type,body){const blob=new Blob([body],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);}
function exportBackup(){tick();persist();const data=recovery||JSON.stringify({...state,active:null,exportedAt:new Date().toISOString()},null,2);download(`星岛数学-${C.localDay()}${recovery?'-恢复原文':''}.json`,'application/json;charset=utf-8',data);modal('备份文件已准备好',`<p>在 iPad 的下载列表或分享菜单里，将 JSON 文件存到“文件”中的固定文件夹。请确认看见文件后，再点下面的按钮。</p><p class="small muted">导出包含题目记录和草稿，不发送到服务器。换设备时用“导入并合并”恢复记录。</p><div class="actions">${button('我已存好这份备份','confirm-backup','','primary')}${button('稍后确认','close-modal')}</div>`);}
function exportCSV(){const row=x=>x.map(v=>{let s=String(v??'');if(/^[=+@-]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';}).join(',');const rows=[['日期','知识点','题目','阶段','首次状态','首次答案','提示次数','尝试次数','后来完成','前台用时秒']];for(const e of state.events){const q=C.makeQuestion(e.skill,e.seed,e.baseline);rows.push([e.at,C.skillMap[e.skill].name,q.prompt,e.phase,outcomeText(e),JSON.stringify(e.answers),e.hints,e.tries,e.finalCorrect?'是':'否',e.seconds]);}download(`星岛数学明细-${C.localDay()}.csv`,'text/csv;charset=utf-8','\ufeff'+rows.map(row).join('\r\n'));toast('完整明细已准备下载。');}
function exportSummary(){const rows=C.skills.map(s=>{const p=C.progress(state,s.id);return `<tr><td>${s.name}</td><td>${p.independent}/${p.attempted}</td><td>${p.assisted}</td><td>${p.label}</td><td>${p.due||'未安排'}</td></tr>`;}).join('');const body=`<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星岛数学学习摘要</title><style>body{font-family:system-ui;max-width:900px;margin:30px auto;padding:20px;color:#23424b;line-height:1.8}table{border-collapse:collapse;width:100%}th,td{border:1px solid #ccd8cd;padding:9px;text-align:left}th{background:#eaf3e5}small{color:#526c65}</style><h1>${esc(state.prefs.name)}的学习摘要</h1><p>导出日期：${C.localDay()} · 已记录 ${doneEvents().length} 次尝试</p><p>首次独立正确与提示后完成分开记录；未学内容不算错。本摘要用于沟通学习过程，不是学校测验或认知评估。</p><table><tr><th>知识点</th><th>首次独立/已尝试</th><th>借助反馈完成</th><th>当前观察</th><th>计划回访</th></tr>${rows}</table><p>“隔日也会”：至少三个不同日期的独立成功，至少两次隔日成功，首次到最近一次成功相隔至少七天。答题难度为本工具内的固定知识目标，不能泛化为整个学年的掌握。</p><small>手写草稿未自动批改，选择正确理由也不能完全替代口头解释。数据仅来自本机记录。</small></html>`;download(`星岛数学学习摘要-${C.localDay()}.html`,'text/html;charset=utf-8',body);toast('学习摘要已准备下载，可直接打开或打印。');}
function speak(text){if(!('speechSynthesis'in window)){toast('此设备暂不支持朗读，文字讲解仍可使用。');return;}const voices=speechSynthesis.getVoices(),voice=voices.find(v=>v.localService&&/^zh[-_](CN|Hans)/i.test(v.lang))||voices.find(v=>v.localService&&/^zh/i.test(v.lang));if(!voice){toast('暂未找到本机中文声音；可在 iPad 系统中下载中文声音。');return;}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.voice=voice;u.lang=voice.lang;u.rate=.88;speechSynthesis.speak(u);}
async function setupOffline(){if(location.protocol==='file:'){swMessage='当前是单文件模式。';return;}if(!('serviceWorker'in navigator)){swMessage='当前打开方式不支持离线安装。请使用 iPad Safari 的 HTTPS 网址。';return;}try{const reg=await navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'});await navigator.serviceWorker.ready;const cache=await caches.open(window.ISLAND_CACHE||'star-island-v1');offlineReady=!!await cache.match(new URL('./index.html',location.href).href);if(reg.waiting&&state.active)swMessage='新版已下载，结束这次探索后重新打开即可更新。';reg.addEventListener('updatefound',()=>{const w=reg.installing;w?.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)toast('新版本已备好，下次重新打开时使用。');});});}catch(e){swMessage='离线资源暂未准备好。请保持联网并重新打开一次；当前学习记录仍在本机。';}if($('offline-status'))$('offline-status').textContent=offlineText();}
document.addEventListener('input',e=>{if(e.target.dataset.answer&&current()){current().draft[e.target.dataset.answer]=e.target.value;persist();}});
document.addEventListener('focusin',e=>{if(e.target.dataset.answer){focusField=e.target.dataset.answer;document.querySelectorAll('.answer-input').forEach(el=>el.classList.toggle('active',el===e.target));}});
document.addEventListener('change',e=>{if(e.target.dataset.enabled){const id=e.target.dataset.enabled;state.prefs.enabled=e.target.checked?[...new Set([...state.prefs.enabled,id])]:state.prefs.enabled.filter(x=>x!==id);persist();}});
document.addEventListener('pointerdown',e=>{if(e.target.closest('[data-action="key"]'))e.preventDefault();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Enter'&&e.target.dataset.answer){e.preventDefault();check();}});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const d=b.dataset;
 switch(d.action){
 case 'nav':nav(d.to);break;case 'close-modal':closeModal();break;case 'baseline':closeModal();startBaseline(+d.part);break;
 case 'daily':requestStart('daily',C.plan(state,state.prefs.minutes===5?2:state.prefs.minutes===15?5:4));break;
 case 'practice':if(screen==='lab')markLesson(d.skill);closeModal();requestStart('practice',[d.skill]);break;
 case 'resume':closeModal();if(state.active)nav('session');break;
 case 'pause':syncDraft();persist();nav('home');break;
 case 'finish-partial':closeModal();finish(true);break;
 case 'check':check();break;case 'next':next();break;case 'unknown':skip('unknown');break;case 'unlearned':skip('unlearned');break;
 case 'hint':if(current()&&state.active.type!=='baseline'){syncDraft();current().hints=Math.min(current().hints+1,3);updateHintRecord();persist();render();}break;
 case 'explain':syncDraft();current().hints=3;updateHintRecord();persist();render();break;
 case 'next-assisted':if(!current().eventId)record('unknown',null);next();break;
 case 'choose':if(current()){syncDraft();current().draft[d.field]=d.value;persist();render();}break;
 case 'key':{if(!current())break;const q=question(),inputs=q.fields.filter(f=>f.type!=='choice');if(!inputs.length)break;if(!focusField||!inputs.some(f=>f.id===focusField))focusField=inputs[0].id;const input=$('answer-'+focusField);if(!input||input.disabled)break;if(d.key==='下一格'){focusField=inputs[(inputs.findIndex(f=>f.id===focusField)+1)%inputs.length].id;$('answer-'+focusField)?.focus();break;}let v=input.value,start=input.selectionStart??v.length,end=input.selectionEnd??start;if(d.key==='清空'){v='';start=0;}else if(d.key==='⌫'){if(start===end){v=v.slice(0,Math.max(0,start-1))+v.slice(end);start=Math.max(0,start-1);}else v=v.slice(0,start)+v.slice(end);}else{v=v.slice(0,start)+d.key+v.slice(end);start+=d.key.length;}input.value=v.slice(0,200);input.focus({preventScroll:true});input.setSelectionRange(start,start);current().draft[focusField]=input.value;persist();break;}
 case 'undo':if(current()){current().drawing.pop();redraw();persist();}break;
 case 'clear-drawing':modal('清空这题的草稿？',`<p>清空这题的草稿，输入答案和其他题目的记录保留。</p><div class="actions">${button('清空当前草稿','confirm-clear','','danger')}${button('保留','close-modal','','primary')}</div>`);break;
 case 'confirm-clear':if(current()){current().drawing=[];redraw();persist();}closeModal();break;
 case 'lesson':selectedSkill=d.skill;markLesson(d.skill);nav('lesson');break;
 case 'review-event':eventModal(d.id);break;
 case 'speak':speak(question()?.prompt||'');break;case 'speak-lesson':{const q=C.makeQuestion(d.skill,101,true);speak(q.prompt+'。'+q.steps.join('。'));break;}
 case 'lab-tab':lab.type=d.tab;if(d.tab==='area')lab.d=2;nav('lab');break;
 case 'lab-change':lab[d.what]=Math.max(d.what==='d'?2:0,Math.min(d.what==='d'?12:lab.d,lab[d.what]+Number(d.delta)));lab.n=Math.min(lab.n,lab.d);render();break;
 case 'lab-stations':lab.stations=+d.n;render();break;
 case 'lab-height':lab.d=+d.n;render();break;case 'lab-guides':lab.guides=!lab.guides;render();break;
 case 'save-prefs':state.prefs.name=$('nickname').value.trim().slice(0,12)||'小探索家';state.prefs.minutes=Number($('minutes').value);persist();toast('已经记住你的节奏。');break;
 case 'export':exportBackup();break;case 'confirm-backup':state.backupAt=C.localDay();persist();closeModal();toast('备份日期已记下。');break;
 case 'csv':exportCSV();break;case 'summary-export':exportSummary();break;
 case 'import':$('import-file').click();break;
 case 'confirm-import':if(importCandidate){state=C.mergeImport(state,importCandidate);importCandidate=null;persist();closeModal();nav('records');toast('已经合并记录，重复题目不会重复计数。');}break;
 case 'persist-data':try{const ok=await navigator.storage?.persist?.();toast(ok?'浏览器已允许优先保留本机数据，仍建议定期备份。':'浏览器暂未承诺持久保留。固定从主屏幕进入，并定期备份。');}catch(e){toast('当前打开方式不支持此申请，请定期备份。');}break;
 case 'offline-check':await setupOffline();toast(offlineText());break;
 }
});
$('import-file').addEventListener('change',async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;if(file.size>20*1024*1024){toast('备份超过20 MB，请先确认选择了正确的文件。');return;}try{const obj=JSON.parse(await file.text()),clean=C.validateImport(obj);importCandidate=obj;const old=new Set(state.events.map(e=>e.id)),count=clean.events.filter(e=>!old.has(e.id)).length;modal('合并这份学习记录？',`<p>这份文件有 ${clean.events.length} 条记录，其中 ${count} 条是本机尚未保存的。现有记录会保留，不替换正在进行的练习。</p><div class="actions">${button('合并记录','confirm-import','','primary')}${button('取消','close-modal')}</div>`);}catch(err){toast(err.message||'文件无法读取，请选择导出的 JSON 备份。');}});
document.addEventListener('visibilitychange',()=>{tick();if(document.hidden)persist();lastTick=Date.now();});window.addEventListener('pagehide',()=>{tick();persist();});setInterval(()=>{tick();if(state.active)persist();},5000);
render();setupOffline();
