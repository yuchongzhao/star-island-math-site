function markExposureOnly(id){if(!s.exposures.some(e=>e.wordId===id&&e.day===C.day())){s.exposures.push({wordId:id,day:C.day()});save();}}
function errorTitle(k){return {missing:'少了一个字母，把它放回正确位置',extra:'多写了一个字母，看看正确的组合',swap:'两个字母换了位置',replace:'有一个字母需要换一换',case:'字母对了，再照顾首字母大写',mixed:'把这个词重新分成小段',blank:'先建立线索，下次再来找它'}[k]||'留意正确词里的字母顺序';}
function record(correct,answer='',kind=''){tick();const it=item();if(it.eventId)return;const primed=s.exposures.some(x=>x.wordId===it.wordId&&x.day===C.day());if(primed)it.phase='practice';const e={id:uid(),sessionId:s.active.id,wordId:it.wordId,day:C.day(),at:new Date().toISOString(),mode:it.mode,method:it.mode==='meaning'?'choice':it.method,answer,correct,phase:it.phase,independent:correct&&it.phase==='cold'&&it.hints===0&&it.method==='typed'&&['spell','dictation'].includes(it.mode),hints:it.hints,kind,note:'',seconds:Math.round(it.seconds),drawing:it.drawing};s.events.push(e);it.eventId=e.id;markExposureOnly(it.wordId);save();render();}
function check(){const it=item();if(!it||it.eventId)return;it.draft=$('spell-answer')?.value||it.draft;const w=word(it.wordId),alternatives={everyone:['everybody'],lab:['laboratory'],start:['begin'],end:['finish'],'take a break':['have a break']};if(alternatives[w.word]?.includes(C.norm(it.draft))){it.hints=2;it.phase='practice';mark(w.id);save();render();tell(`你写的是另一种正确说法；本卡练 ${w.word}。这次不记拼写错误，先合上再试。`);return;}const r=C.compare(w.word,it.draft);if(!r.valid){$('answer-error').textContent='先留一个自己的答案，或选择“暂时想不起”；空白不记错。';return;}record(r.correct,it.draft,r.kind);}
function next(){const it=item(),a=s.active;if(!a||!it?.eventId)return;const e=s.events.find(e=>e.id===it.eventId),remaining=a.queue.slice(a.index+1);if(!e.correct&&['spell','dictation'].includes(it.mode)&&it.phase==='cold'&&a.added<2&&remaining.some(x=>x.wordId!==it.wordId)){a.queue.push(newItem(it.wordId,'practice',it.mode));a.added++;}a.index++;if(a.index>=a.queue.length){finish(false);return;}if(a.seconds>=(a.type==='weekly'?5:s.prefs.minutes)*60){finish(true);return;}save();nav('session');}
function finish(partial=true){if(!s.active)return;tick();const a=s.active;lastSession={id:a.id,day:C.day(),eventIds:s.events.filter(e=>e.sessionId===a.id).map(e=>e.id),seconds:Math.round(a.seconds),partial};if(lastSession.eventIds.length)s.sessions.push(lastSession);s.active=null;save();nav('summary');}
function summary(){const z=lastSession||s.sessions.at(-1);if(!z)return home();const es=s.events.filter(e=>z.eventIds.includes(e.id)),cold=es.filter(e=>e.phase==='cold'&&e.method==='typed'&&['spell','dictation'].includes(e.mode)),practice=es.filter(e=>e.phase==='practice'&&e.method==='typed'&&['spell','dictation'].includes(e.mode));return `<section class="hero"><div class="hero-copy"><div class="eyebrow">今天的记忆邮件，已经投递</div><h1>留下一点线索，<br>明天再来找它。</h1><p>${z.partial?'已做部分保存了，未完成题不算错。':'这一小段路走完了，可以安心休息。'}</p><div class="scoreline"><div class="stat"><strong>${cold.length?`${cold.filter(e=>e.independent).length}/${cold.length}`:'—'}</strong><span>首次独立正确 / 自动核验</span></div><div class="stat"><strong>${practice.filter(e=>e.correct).length}/${practice.length}</strong><span>看过后练习正确</span></div></div>${btn('今天先到这里','nav','data-to="home"','primary')}</div>${art()}</section><div class="card"><h2>带走这些发现</h2>${es.map(e=>`<div class="task"><span class="task-icon">${e.correct?'✦':'↺'}</span><div class="task-copy"><strong>${esc(word(e.wordId)?.meaning||'已移除词条')}</strong><small>${eventLabel(e)}${e.correct?' · 这次完成':' · 下次再回访'}</small></div>${btn('回看','review',`data-id="${e.id}"`,'small')}</div>`).join('')||'<p>今天没有提交答案，也没有被算错。</p>'}<div class="actions">${btn('去花园看看','nav','data-to="garden"','secondary')}${btn('保存备份','export')}</div></div>`;}
function eventLabel(e){return e.method==='hand'?'手写自核':e.mode==='meaning'?'词义辨认':e.mode==='use'?'句中运用':e.independent?'独立首答正确':e.phase==='practice'?'看过后练习':e.hints?'借助线索':'独立尝试';}
function records(){const es=s.events.filter(e=>C.gap(C.day(),e.day)>=0&&C.gap(C.day(),e.day)<7),cold=es.filter(e=>e.phase==='cold'&&e.method==='typed'&&['spell','dictation'].includes(e.mode)),hand=es.filter(e=>e.method==='hand');return `<div class="row between"><div><div class="eyebrow">学习手记</div><h1>看清“记得”的不同阶段</h1></div>${btn('保存备份','export','','primary')}</div><section class="card"><h2>最近 7 天</h2><div class="scoreline"><div class="stat"><strong>${cold.length?`${cold.filter(e=>e.independent).length}/${cold.length}`:'—'}</strong><span>首次独立正确 / 自动核验</span></div><div class="stat"><strong>${hand.filter(e=>e.correct).length}/${hand.length}</strong><span>手写自核正确 / 自核次数</span></div><div class="stat"><strong>${s.words.filter(w=>C.progress(s,w.id).stable).length}</strong><span>观察到隔日能写出</span></div></div><p class="small muted">拼写、词义选择和句中运用分开记录；看过词卡后的成功不会提高“独立记住”的等级。这不是学校分数。</p></section><div class="subhead"><h2>四个观察窗口</h2></div><div class="grid four">${[['spell','看词义拼写'],['dictation','听音拼写'],['meaning','词义辨认'],['use','句中运用']].map(([id,t])=>{const x=es.filter(e=>e.mode===id&&e.method!=='hand');return `<div class="card"><h3>${t}</h3><strong>${x.filter(e=>e.correct).length}/${x.length}</strong><p class="small muted">此任务的正确次数，含练习；不能互相替代。</p></div>`;}).join('')}</div><div class="subhead"><h2>学校反馈</h2>${btn('记下学校默写','school','','secondary')}</div><section class="card">${s.school.length?s.school.slice(-5).reverse().map(x=>`<p>${esc(x.day)} · ${x.total?`${x.correct}/${x.total} 正确`:'未填总分'} · ${x.wrongIds.length} 个词加入回访</p>`).join(''):'<p>可以记录学校默写结果，并把常错词放到优先复习的位置。</p>'}<p class="small muted">由孩子或家长录入，单列为学校反馈，不当作系统自动测量。</p></section><div class="subhead"><h2>最近的探索</h2>${btn('导出学习摘要','export-summary','','quiet')}</div><div class="card ledger"><table><thead><tr><th>日期</th><th>词义</th><th>任务</th><th>结果</th><th></th></tr></thead><tbody>${s.events.slice(-60).reverse().map(e=>`<tr><td>${e.day}</td><td>${esc(word(e.wordId)?.meaning)}</td><td>${eventLabel(e)}</td><td>${e.correct?'完成':'待回访'}</td><td>${btn('回看','review',`data-id="${e.id}"`,'small')}</td></tr>`).join('')}</tbody></table><p class="small muted">页面显示最近 60 条，备份包含全部作答及草稿。</p></div>${backupHint()}`;}
function garden(){const seen=new Set(s.events.map(e=>e.wordId)).size,stable=s.words.filter(w=>C.progress(s,w.id).stable).length;return `<div class="eyebrow">记忆花园</div><h1>今天的尝试，也会发芽</h1><p>每探索一个词，就留下一个芽。隔几天还能独立写出，它才开花。不因休息退回空地。</p><div class="garden word-garden" aria-label="探索 ${seen} 个词，隔日能写出 ${stable} 个词">${s.words.slice(0,48).map(w=>`<div title="${esc(w.meaning)}"><span aria-hidden="true">${C.progress(s,w.id).stable?'🌼':C.progress(s,w.id).seen?'🌱':'·'}</span><small>${esc(w.meaning)}</small></div>`).join('')||'<p>加入第一批词，就能开始种下记忆。</p>'}</div><div class="scoreline"><div class="stat"><strong>${seen}</strong><span>探索过的词</span></div><div class="stat"><strong>${stable}</strong><span>隔日能写出</span></div><div class="stat"><strong>${new Set(s.sessions.map(x=>x.day)).size}</strong><span>留下探索的日子</span></div></div><div class="card"><h2>周末的小回顾</h2><p>最多 5 分钟，选 3 个已经练过的词试着回想，再玩一个词义或句子小任务。看的是隔天还会不会，别临时把词表重看一遍。</p><div class="actions">${btn('抽 3 个旧词回访','weekly','','primary')}${btn('玩一个词义任务','meaning-game')}${btn('试一个句子','use-game')}</div></div>`;}
function settings(){return `<div class="eyebrow">让方法适合今天</div><h1>每天很短，记录很长</h1><div class="grid two"><section class="card settings"><label for="nickname">岛上的称呼</label><input id="nickname" maxlength="12" value="${esc(s.prefs.name)}"><label for="minutes">英语一次多久</label><select id="minutes">${[5,8,12].map(n=>`<option value="${n}" ${s.prefs.minutes===n?'selected':''}>${n} 分钟</option>`).join('')}</select><label for="prompt-mode">拼写的提示方式</label><select id="prompt-mode"><option value="meaning" ${s.prefs.mode==='meaning'?'selected':''}>看中文词义拼英文</option><option value="audio" ${s.prefs.mode==='audio'?'selected':''}>听英语发音拼英文</option></select><label for="accent">朗读口音</label><select id="accent"><option value="en-GB" ${s.prefs.accent==='en-GB'?'selected':''}>英式优先</option><option value="en-US" ${s.prefs.accent==='en-US'?'selected':''}>美式优先</option></select><div class="actions">${btn('保存设置','save-prefs','','primary')}${btn('试听 hello','sound-test')}${btn('教材录音','audio-library')}</div><p class="small muted">发音用设备的英语声音，不录音、不进行发音评分。优先使用本机声音；缺少英语声音时可改用词义提示。</p><p class="small muted">${voices.filter(v=>/^en/i.test(v.lang)&&v.localService).length?'已找到本机英语声音。':'尚未找到本机英语声音。可以在系统设置中下载英语声音后重开。'}</p></section><div class="grid"><section class="card"><h2>安装与备份</h2><p id="offline-status">${offline?'离线资源已备好。':'正在准备离线资源；首次打开需要联网。'}</p><p>Safari 打开网址 → 分享 → 添加到主屏幕。以后固定从同一个图标进入。</p><div class="actions">${btn('检查离线资源','offline')}${btn('导出备份','export')}${btn('导入并合并','import')}</div><p class="small muted">词表、记录和草稿留在本机。每周导出 JSON 到“文件”，以防设备或网站数据被清理。备份不恢复进行中的会话。</p></section><section class="card"><h2>怎么看才不误判</h2><p>独立拼写至少在三个不同日期成功，且首次到最近相隔至少 7 天，才标记“隔日能写出”。看词卡、用提示、手写自核与当天练习不冒充这个证据。</p><p>这是本工具的观察标准，不是能力诊断。词义选择对，不代表能独立拼写；会拼写，也不等于完整英语能力。</p></section><section class="card"><h2>给家长的一点安排</h2><p>先用 2 周观察 5—10 个学校常错词。每周核对一次词表和备份；问她“哪个位置最容易绕路”，让她教您一个记忆线索即可。</p><p class="small muted">如果持续练习 2—4 周仍几乎无法保留少量词，或听音、阅读也明显吃力，可带具体记录请英语老师进一步观察。一次低分不足以判断原因。</p><p class="small muted">间隔回想与及时反馈的依据：<a href="https://ies.ed.gov/ncee/wwc/PracticeGuide/1" target="_blank" rel="noreferrer">IES 学习指南</a>。本应用的分钟数、词量和分级阈值是实践起点，不是研究验证的个体处方。</p></section></div></div>`;}
function speak(id){const w=word(id);play(w?w.word:id);}
function play(text){if(!('speechSynthesis'in window)){tell('此打开方式没有朗读。请改用中文提示。');return;}voices=speechSynthesis.getVoices();const v=voices.find(x=>x.localService&&x.lang===s.prefs.accent)||voices.find(x=>x.localService&&/^en/i.test(x.lang));if(!v){tell('暂未找到本机英语声音。请先用中文提示，或在系统中下载英语声音。');return;}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.voice=v;u.lang=v.lang;u.rate=.78;u.onerror=()=>tell('声音播放未完成，可以重听或改用中文提示。');speechSynthesis.speak(u);}
function bindCanvas(){observer?.disconnect();canvas=$('scratch');if(!canvas)return;ctx=canvas.getContext('2d');const resize=()=>{const r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,3);canvas.width=r.width*d;canvas.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);redraw();};observer=new ResizeObserver(resize);observer.observe(canvas);resize();const point=e=>{const r=canvas.getBoundingClientRect();return [Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))];};canvas.onpointerdown=e=>{if(e.button!==0||s.prefs.penOnly&&e.pointerType!=='pen')return;e.preventDefault();canvas.setPointerCapture(e.pointerId);stroke=[point(e)];item().drawing.push(stroke);redraw();};canvas.onpointermove=e=>{if(!stroke)return;e.preventDefault();const p=point(e),last=stroke.at(-1);if(stroke.length<1200&&Math.abs(p[0]-last[0])+Math.abs(p[1]-last[1])>.003){stroke.push(p);redraw();}};const end=()=>{stroke=null;save();};canvas.onpointerup=end;canvas.onpointercancel=end;}
function redraw(){if(!canvas||!ctx)return;const r=canvas.getBoundingClientRect();ctx.clearRect(0,0,r.width,r.height);ctx.strokeStyle='#4c4e75';ctx.fillStyle='#4c4e75';ctx.lineWidth=2.5;ctx.lineCap='round';ctx.lineJoin='round';for(const st of item()?.drawing||[]){if(!st.length)continue;ctx.beginPath();ctx.moveTo(st[0][0]*r.width,st[0][1]*r.height);st.slice(1).forEach(p=>ctx.lineTo(p[0]*r.width,p[1]*r.height));if(st.length===1){ctx.arc(st[0][0]*r.width,st[0][1]*r.height,1.2,0,Math.PI*2);ctx.fill();}else ctx.stroke();}}
function drawingSVG(d){return d?.length?`<svg class="math-svg" viewBox="0 0 500 260" role="img" aria-label="保存的拼写草稿"><rect width="500" height="260" fill="#f6f5ec"/>${d.map(st=>`<polyline points="${st.map(p=>`${Number(p[0])*500},${Number(p[1])*260}`).join(' ')}" fill="none" stroke="#4c4e75" stroke-width="2.5" stroke-linecap="round"/>`).join('')}</svg>`:'<p class="small muted">这次没有保存手写草稿。</p>';}
function download(name,type,text){const u=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),60000);}
function backup(){tick();save();download(`星岛英语-${C.day()}.json`,'application/json',recovery||JSON.stringify({...s,active:null,exportedAt:new Date().toISOString()},null,2));modal('给记录存一份备份',`<p>把 JSON 文件保存到 iPad“文件”的固定文件夹。确认文件可见后再点“已存好”。备份包含词表、作答和草稿，不上传服务器。</p><div class="actions">${btn('已存好','backup-confirm','','primary')}${btn('稍后确认','close')}</div>`);}
function exportSummary(){const cold=s.events.filter(e=>e.phase==='cold'&&e.method==='typed'&&['spell','dictation'].includes(e.mode));const rows=s.words.map(w=>{const p=C.progress(s,w.id);return `<tr><td>${esc(w.word)}</td><td>${esc(w.meaning)}</td><td>${p.correct}/${p.attempts}</td><td>${p.repeat>=2?'重复拼写已出现':'—'}</td><td>${p.hand}</td><td>${p.label}</td><td>${p.due||'待安排'}</td></tr>`;}).join('');download(`星岛英语学习摘要-${C.day()}.html`,'text/html',`<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>英语学习摘要</title><style>body{font-family:system-ui;max-width:1000px;margin:auto;padding:30px;line-height:1.8}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ccd0d8;padding:8px;text-align:left}</style><h1>${esc(s.prefs.name)}的英语学习摘要</h1><p>${C.day()} · 独立首答 ${cold.filter(e=>e.independent).length}/${cold.length}（自动核验）</p><p>词义辨认、句中运用、提示后练习和手写自核分开记录。数据来自设备内的练习，不是学校成绩或认知诊断。</p><table><tr><th>词</th><th>意思</th><th>独立首答</th><th>常错位置</th><th>手写自核次数</th><th>观察</th><th>下次回访</th></tr>${rows}</table><p>隔日能写出：至少三个不同日期的独立拼写成功，跨度至少七天；不能泛化为完整英语能力。更有价值的问题是：她是否知道词义、能否听辨、常漏哪些字母组合，以及隔天是否仍能写出？</p></html>`);tell('学习摘要已准备下载。');}
function game(mode){const candidates=s.words.filter(w=>w.enabled&&C.progress(s,w.id).seen&&(mode!=='use'||w.sentence));if(!candidates.length){tell(mode==='use'?'先练几个带例句的词，再来试。':'先探索几个词，再来玩词义任务。');return;}if(s.active){start([]);return;}const w=candidates[Math.floor(Math.random()*candidates.length)],it=newItem(w.id,'practice',mode);it.learn=false;if(mode==='meaning'){const other=[...new Set(s.words.filter(x=>x.id!==w.id).map(x=>x.meaning))].filter(x=>x!==w.meaning).slice(0,2);if(other.length<1){tell('词义任务至少需要两个意思不同的词。');return;}it.options=[w.meaning,...other].sort(()=>Math.random()-.5);}s.active={id:uid(),type:'game',day:C.day(),queue:[it],index:0,seconds:0,added:0};save();nav('session');}
function review(id){const e=s.events.find(e=>e.id===id);if(!e)return;const w=word(e.wordId);mark(w.id);modal('回看这个发现',`<p class="small muted">${e.day} · ${eventLabel(e)} · ${e.correct?'完成':'待回访'}</p><p>首次输入：${esc(e.answer||'手写或暂时想不起')}</p>${studyHTML(w,e.method==='typed'&&!e.correct?e.answer:'')}${drawingSVG(e.drawing)}${btn('关闭','close','','primary')}`);}
function schoolModal(){modal('记录学校默写反馈',`<div class="settings"><label for="school-date">日期</label><input id="school-date" type="date" value="${C.day()}"><div class="grid two"><div><label for="school-total">总词数（可不填）</label><input id="school-total" type="number" min="1" max="500"></div><div><label for="school-correct">写对几个</label><input id="school-correct" type="number" min="0" max="500"></div></div><label for="school-wrong">本次错词，用逗号或换行分开</label><textarea id="school-wrong" rows="3" placeholder="because, different"></textarea><p class="small muted">请先在词袋加入这些词；这里的记录由您或孩子录入。没有确定的分数可以只记错词。</p><div id="school-error" class="error-text" role="alert"></div>${btn('保存并安排回访','save-school','','primary')}</div>`);}
async function offlineSetup(){if(location.protocol==='file:'){if($('offline-status'))$('offline-status').textContent='单文件版：iPad 安装请使用 HTTPS 网址。';return;}try{const reg=await navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'});await navigator.serviceWorker.ready;const cache=await caches.open(window.ENGLISH_CACHE);offline=!!await cache.match(new URL('./index.html',location.href).href);reg.addEventListener('updatefound',()=>{reg.installing?.addEventListener('statechange',()=>{if(reg.waiting)tell('新版已准备好，关掉旧窗口后重开即可使用。');});});}catch(e){offline=false;}if($('offline-status'))$('offline-status').textContent=offline?'离线资源已备好。可断网重开一次确认。':'离线资源暂未备好，请保持联网后重开；已有记录仍在本机。';}
document.addEventListener('input',e=>{if(e.target.id==='spell-answer'&&item()){item().draft=e.target.value;save();}});
document.addEventListener('change',e=>{if(e.target.id==='outside-help'&&item()){if(e.target.checked)item().hints=Math.max(item().hints,1);else if(item().hints)e.target.checked=true;save();}if(e.target.id==='pen-only'){s.prefs.penOnly=e.target.checked;save();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')close();if(e.key==='Enter'&&e.target.id==='spell-answer'){e.preventDefault();check();}});
document.addEventListener('click',async e=>{const el=e.target.closest('[data-action]');if(!el||el.disabled)return;const d=el.dataset;switch(d.action){
case 'nav':nav(d.to);break;case 'close':close();break;case 'daily':start(C.plan(s).ids);break;case 'resume':close();if(s.active)nav('session');break;case 'pause':save();nav('home');break;case 'finish':close();finish(true);break;
case 'load-pack':{const pack=Course.cards(d.pack,C.day()),seen=new Set(s.words.map(w=>C.norm(w.word)));let n=0;for(const w of pack){if(!seen.has(C.norm(w.word))){s.words.push(w);seen.add(C.norm(w.word));n++;}}save();nav('home');tell(n?`已加入 ${n} 个词，每天只安排少量。`:'这份词表已经在词袋里了。');break;}
case 'demo':if(!s.words.some(w=>w.source==='demo')){s.words.push(...C.starters.slice(0,8).map(w=>({...w})));save();}nav('home');break;
case 'preview-list':try{listDraft=C.parseList($('word-list').value).map(w=>({...w,known:$('already-known').checked}));const existing=new Set(s.words.map(w=>C.norm(w.word))),fresh=listDraft.filter(w=>!existing.has(C.norm(w.word)));modal('对照课本，核对这份词表',`<p>将加入 ${fresh.length} 个新词，跳过 ${listDraft.length-fresh.length} 个已有词。</p><div class="preview-words">${listDraft.map(w=>`<div><strong lang="en">${esc(w.word)}</strong> — ${esc(w.meaning)}</div>`).join('')}</div><p class="small muted">这些拼写会成为判分答案。已有词卡可在词袋打开后编辑。</p><div class="actions">${btn('已经核对，加入词袋','confirm-list','','primary')}${btn('返回修改','close')}</div>`);}catch(err){$('list-error').textContent=err.message;}break;
case 'confirm-list':{const seen=new Set(s.words.map(w=>C.norm(w.word)));for(const w of listDraft||[]){if(!seen.has(C.norm(w.word))){s.words.push({...w,id:uid()});seen.add(C.norm(w.word));}}for(const x of listDraft||[]){const w=s.words.find(w=>C.norm(w.word)===C.norm(x.word));if(w)markExposureOnly(w.id);}listDraft=null;save();close();nav('home');break;}
case 'audio-library':try{await audioLibrary();}catch(err){tell('暂时无法读取本机录音。');}break;case 'audio-import':$('audio-file').click();break;case 'play-audio':{const a=audioList.find(x=>x.id===d.id);if(a){if(audioURL)URL.revokeObjectURL(audioURL);audioURL=URL.createObjectURL(a.blob);$('audio-player').innerHTML=`<p>${esc(a.name)}</p><audio controls preload="metadata" style="width:100%" src="${audioURL}"></audio>`;}break;}
case 'filter':filter=d.filter;render();break;case 'word-card':wordCard(d.id);break;case 'toggle-word':word(d.id).enabled=!word(d.id).enabled;save();render();break;case 'one':start([d.id],'one');break;
case 'edit-word':{const w=word(d.id);modal('编辑词卡',`<div class="settings"><p>英文拼写是历史核验依据，此处保持不变：<b lang="en">${esc(w.word)}</b>。如需纠正拼写，请暂停此词，再加入正确词。</p><label for="edit-meaning">中文词义</label><input id="edit-meaning" value="${esc(w.meaning)}"><label for="edit-sentence">例句（留一个 ___）</label><input id="edit-sentence" value="${esc(w.sentence)}"><label for="edit-chunks">拼写块（用 / 分开）</label><input id="edit-chunks" value="${esc(w.chunks)}"><label for="edit-tip">我发现的记忆线索</label><textarea id="edit-tip">${esc(w.tip)}</textarea><div id="edit-error" class="error-text"></div>${btn('保存词卡','save-word',`data-id="${esc(w.id)}"`,'primary')}</div>`);break;}
case 'save-word':try{const w=word(d.id),clean=C.wordFromFields([w.word,$('edit-meaning').value,$('edit-sentence').value,$('edit-chunks').value,$('edit-tip').value],w.id);Object.assign(w,{meaning:clean.meaning,sentence:clean.sentence,chunks:clean.chunks,tip:clean.tip});save();close();nav('words');}catch(err){$('edit-error').textContent=err.message;}break;
case 'speak':speak(d.id);break;case 'sound-test':play('hello');break;
case 'learn-done':{const it=item();it.learn=false;it.phase='practice';const a=s.active;if(a.index<a.queue.length-1){a.queue.splice(a.index,1);a.queue.push(it);}save();nav('session');break;}
case 'method':item().method=d.method;save();render();break;case 'check':check();break;
case 'hint':item().hints=Math.min(2,item().hints+1);if(item().hints===2)mark(item().wordId);save();render();break;
case 'meaning-fallback':item().mode='spell';save();render();tell('已改用词义提示，这次按看词义拼写记录。');break;
case 'use-hint':item().hints=Math.max(1,item().hints);save();tell(word(item().wordId).meaning);break;
case 'unknown':record(false,'','blank');break;case 'next':next();break;case 'note':{const e=s.events.find(x=>x.id===item().eventId);e.note=d.note;save();render();break;}
case 'hand-reveal':item().feedback='hand-check';mark(item().wordId);save();render();break;case 'self-yes':record(true,'','self');break;case 'self-no':record(false,'','self');break;
case 'meaning-answer':record(item().options[+d.option]===word(item().wordId).meaning,item().options[+d.option],'meaning');break;
case 'undo':item().drawing.pop();redraw();save();break;case 'clear':modal('清空这题草稿？',`<p>只清空当前未提交题的草稿。</p><div class="actions">${btn('清空当前草稿','confirm-clear')}${btn('保留','close','','primary')}</div>`);break;case 'confirm-clear':item().drawing=[];redraw();save();close();break;
case 'weekly':start(s.words.filter(w=>w.enabled&&C.progress(s,w.id).seen).sort((a,b)=>(C.progress(s,a.id).due||'').localeCompare(C.progress(s,b.id).due||'')).slice(0,3).map(w=>w.id),'weekly');break;
case 'meaning-game':game('meaning');break;case 'use-game':game('use');break;
case 'save-prefs':s.prefs.name=$('nickname').value.trim().slice(0,12)||'小探索家';s.prefs.minutes=Number($('minutes').value);s.prefs.mode=$('prompt-mode').value;s.prefs.accent=$('accent').value;save();tell('已记住今天的节奏。');break;
case 'export':backup();break;case 'backup-confirm':s.backupAt=C.day();save();close();tell('备份日期已记录。');break;case 'import':$('import-file').click();break;case 'confirm-import':try{s=C.merge(s,importing);importing=null;save();close();nav('records');tell('已合并，重复作答不会重复计数。');}catch(err){tell(err.message);}break;case 'export-summary':exportSummary();break;
case 'review':review(d.id);break;case 'school':schoolModal();break;case 'save-school':{const day=$('school-date').value,totalText=$('school-total').value,correctText=$('school-correct').value,total=totalText?Number(totalText):null,correct=correctText?Number(correctText):null,list=[...new Set($('school-wrong').value.split(/[,，\n]+/).map(C.norm).filter(Boolean))],missing=list.filter(x=>!s.words.some(w=>C.norm(w.word)===x));if(!C.validDate(day)||day>C.day()||(total!==null&&(!Number.isInteger(total)||total<1||total>500||!Number.isInteger(correct)||correct<0||correct>total))||(total===null&&correct!==null)||missing.length||(total!==null&&list.length>total-correct)){ $('school-error').textContent=missing.length?'先在词袋加入这些词：'+missing.join(', '):'请检查日期、总数、正确数与错词数量是否一致。';break;}if(total===null&&!list.length){$('school-error').textContent='请填写分数或至少一个错词。';break;}s.school.push({id:uid(),day,total,correct,wrongIds:[...new Set(list.map(x=>s.words.find(w=>C.norm(w.word)===x).id))]});save();close();nav('records');break;}
case 'offline':await offlineSetup();tell(offline?'离线资源已备好。':'请保持联网，并从 Safari 安装网址打开。');break;
}});
$('import-file').addEventListener('change',async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;if(file.size>50*1024*1024){tell('文件超过 50 MB，请确认是否选对备份。');return;}try{const obj=JSON.parse(await file.text()),clean=C.validate(obj);importing=obj;const exists=new Set(s.events.map(x=>x.id));modal('合并学习备份？',`<p>文件有 ${clean.words.length} 个词、${clean.events.length} 条作答，其中 ${clean.events.filter(x=>!exists.has(x.id)).length} 条是本机没有的。现有记录和进行中的任务保留。</p><div class="actions">${btn('合并记录','confirm-import','','primary')}${btn('取消','close')}</div>`);}catch(err){tell(err.message||'无法读取备份。');}});
$('audio-file').addEventListener('change',async e=>{const files=[...e.target.files];e.target.value='';if(!db||!files.length)return;if(files.some(f=>f.size>20*1024*1024||!(/\.mp3$/i.test(f.name)||f.type==='audio/mpeg'))){tell('请选 MP3，每段不超过 20 MB。');return;}try{const t=db.transaction('audio','readwrite');for(const f of files)t.objectStore('audio').put({id:f.name+'-'+f.size,name:f.name,size:f.size,blob:f});await new Promise((res,rej)=>{t.oncomplete=res;t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);});await audioLibrary();tell('录音已保存在本机。');}catch(err){tell('录音未保存，请确认本机存储空间。');}});
if('speechSynthesis'in window){voices=speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{voices=speechSynthesis.getVoices();};}
document.addEventListener('visibilitychange',()=>{tick();if(document.hidden)save();lastTick=Date.now();});window.addEventListener('pagehide',()=>{tick();save();});setInterval(()=>{tick();if(s.active)save();},5000);render();offlineSetup();
})();
</script></body></html>
