async function apiRequest(path,options={}){
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),70000);
 try{
  const r=await fetch(api+path,{...options,headers:{'Content-Type':'application/json',...(accessToken()?{'Authorization':'Bearer '+accessToken()}:{}),...options.headers},signal:controller.signal});
  const data=await r.json().catch(()=>({message:'识别服务正在启动，请稍后再试。'}));
  if(!r.ok){const error=Error(data.message||'暂时无法识别，请稍后再试。');error.status=r.status;throw error;}return data;
 }catch(e){if(e.name==='AbortError')throw Error('服务启动较慢，请稍后重试；已有任务可以继续练。');if(e instanceof TypeError)throw Error('现在没有连上识别服务，请检查网络后重试。');throw e;}finally{clearTimeout(timer);}
}

 if(!activationTicket)return;

 try{const data=await apiRequest('/activate',{method:'POST',body:JSON.stringify({ticket:activationTicket})});localStorage.setItem(accessKey,data.token);generationMessage='照片生成已启用，接下来只需拍课文。';tell('这台设备已启用照片生成。');}
 catch(e){generationError=e.message;generationMessage='';}refreshGeneration();
}
async function photoData(file){
 if(!file.type.startsWith('image/')||file.size>30*1024*1024)throw Error('请选择 30 MB 以下的照片或截图。');
 const url=URL.createObjectURL(file);
 try{
  const img=await new Promise((resolve,reject)=>{const el=new Image();el.onload=()=>resolve(el);el.onerror=()=>reject(Error('这张照片无法打开，请改用相机拍照或截图。'));el.src=url;});
  if(Math.min(img.naturalWidth,img.naturalHeight)<200)throw Error('这张照片太小，请拍清楚整页。');
  const ratio=Math.min(1,1800/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*ratio);c.height=Math.round(img.naturalHeight*ratio);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  let data=c.toDataURL('image/jpeg',.86);if(data.length>2200000)data=c.toDataURL('image/jpeg',.7);if(data.length>2300000)throw Error('照片太大，请只拍一页。');return {data};
 }finally{URL.revokeObjectURL(url);}
}

async function waitForGeneration(id){

 while(Date.now()-start<6*60000){
  generationMessage=Date.now()-start>45000?'仍在核对文字和任务来源，可先去做已有任务。':'正在识别原文、核对照片，并拆成小任务…';const status=$('generation-status');if(status)status.textContent=generationMessage;
  let job;try{job=await apiRequest('/jobs/'+id);failures=0;}catch(e){if(e.status===404){sessionStorage.removeItem(jobKey);pendingJob=null;throw e;}if(++failures>=3)throw e;await new Promise(r=>setTimeout(r,4000));continue;}
  if(job.status==='failed'){sessionStorage.removeItem(jobKey);pendingJob=null;throw Error(job.message);}
  if(job.status==='done'){
   if(recovery)throw Error('旧记录暂时无法读取，请先到设置中恢复备份。');
   s=G.accept(s,job.result);save();sessionStorage.removeItem(jobKey);pendingJob=null;sourcePhotos=[];
   const words=job.result.cards.filter(c=>c.kind==='word').length,recites=job.result.cards.filter(c=>c.kind==='recite').length;
   generatedNotice='已准备 '+words+' 张字词卡、'+recites+' 张背默卡。每天只练少量，其余按天安排。';generationMessage='任务已保存到这台设备。';tell(generatedNotice);return;
  }
  await new Promise(r=>setTimeout(r,2500));
 }
 throw Error('这次生成等待较久。重开此页会继续取回结果，不必重新上传照片。');
}

function bindCanvas(){
 observer?.disconnect();canvas=$('scratch');if(!canvas)return;ctx=canvas.getContext('2d');const resize=()=>{const r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,3);canvas.width=r.width*d;canvas.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);redraw();};observer=new ResizeObserver(resize);observer.observe(canvas);resize();
 const point=e=>{const r=canvas.getBoundingClientRect();return [Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))];};
 canvas.onpointerdown=e=>{if(e.button!==0||s.prefs.penOnly&&e.pointerType!=='pen'||stroke)return;if(item().drawing.length>=400){tell('草稿已经很丰富了，可以先提交或撤销几笔。');return;}e.preventDefault();canvas.setPointerCapture(e.pointerId);stroke={id:e.pointerId,points:[point(e)]};item().drawing.push(stroke.points);redraw();};
 canvas.onpointermove=e=>{if(!stroke||stroke.id!==e.pointerId)return;e.preventDefault();const p=point(e),last=stroke.points.at(-1);if(stroke.points.length<1200&&Math.abs(p[0]-last[0])+Math.abs(p[1]-last[1])>.003){stroke.points.push(p);redraw();}};
 const end=e=>{if(stroke?.id!==e.pointerId)return;stroke=null;save();};canvas.onpointerup=end;canvas.onpointercancel=end;
}
function redraw(){if(!canvas||!ctx)return;const r=canvas.getBoundingClientRect();ctx.clearRect(0,0,r.width,r.height);ctx.strokeStyle='#684f42';ctx.fillStyle='#684f42';ctx.lineWidth=2.5;ctx.lineCap='round';ctx.lineJoin='round';for(const st of item()?.drawing||[]){if(!st.length)continue;ctx.beginPath();ctx.moveTo(st[0][0]*r.width,st[0][1]*r.height);st.slice(1).forEach(p=>ctx.lineTo(p[0]*r.width,p[1]*r.height));if(st.length===1){ctx.arc(st[0][0]*r.width,st[0][1]*r.height,1.3,0,Math.PI*2);ctx.fill();}else ctx.stroke();}}

document.addEventListener('keydown',e=>{
 if(e.key==='Escape')close();
 if(e.key==='Tab'&&$('modal-root').firstChild){const f=[...$('modal-root').querySelectorAll('button,input,textarea,select,a')].filter(x=>!x.disabled),first=f[0],last=f.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}
});
document.addEventListener('click',async ev=>{
 const el=ev.target.closest('[data-action]');if(!el||el.disabled||resettingHistory)return;const d=el.dataset;
 switch(d.action){
 case 'enable-device':modal('首次启用照片生成','<div class="settings"><p>如果 Safari 已启用、主屏幕仍提示未启用，在这里粘贴同一条家庭入口链接即可。只需一次，不是 AI Key，也不需要录入课文。</p><label for="family-link">家庭启用链接</label><input id="family-link" type="url" autocomplete="off" spellcheck="false" placeholder="粘贴家庭启用入口的完整链接"><div class="actions">'+B('启用这台设备','enable-device-ok','','primary')+B('取消','close')+'</div></div>');break;
 case 'enable-device-ok':{
  try{const u=new URL($('family-link').value.trim());if(u.protocol!=='https:'||u.hostname!=='star-island-chinese.onrender.com')throw Error('请粘贴星岛语文的家庭启用链接。');const ticket=new URLSearchParams(u.hash.slice(1)).get('activate');if(!ticket)throw Error('这条链接不含启用信息，请使用家庭启用入口。');el.disabled=true;el.textContent='正在启用…';const data=await apiRequest('/activate',{method:'POST',body:JSON.stringify({ticket})});localStorage.setItem(accessKey,data.token);close();render();tell('此入口已启用，可以拍照生成任务。');}catch(e){el.disabled=false;el.textContent='启用这台设备';tell(e.message);}break;
 }
 case 'photo-camera':$('photo-camera')?.click();break;case 'photo-album':$('photo-album')?.click();break;
 case 'photo-remove':sourcePhotos.splice(Number(d.index),1);render();break;
 case 'photo-generate':await generatePhotos();break;
 case 'source-plan':s.prefs.sourceId=$('source-book').value;s.prefs.sourceImage=Number($('source-page').value);s.prefs.sourceMode=$('source-mode').value;save();planLesson(C.plan(s).ids);break;
 case 'reset-history':askHistoryReset();break;case 'confirm-reset-history':await resetHistory();break;
 case 'nav':close();nav(d.to);break;case 'close':close();break;
 case 'today-records':nav('records');break;
 case 'pack':{const seen=new Set(s.cards.map(C.identity));let n=0;for(const c of (d.pack==='all'?[...Course.cards('poem'),...Course.cards('word')]:Course.cards(d.pack))){if(!seen.has(C.identity(c))){s.cards.push(c);seen.add(C.identity(c));n++;}}save();nav('home');tell(n?'已加入 '+n+' 张卡，每天只练少量。':'这份起步包已经在书屋里了。');break;}
 case 'daily':planLesson(C.plan(s).ids);break;case 'weekly':planLesson(C.plan(s,C.day(),true).ids,'weekly');break;case 'begin-lesson':if(lessonDraft){const p=lessonDraft;lessonDraft=null;start(p.ids,p.type);}break;
 case 'resume':close();if(s.active){if(s.active.day!==C.day()){s.active.queue.forEach(it=>it.phase='practice');tell('上次未完成的卡今天按练习继续，不计为新的独立首答。');}nav('session');}break;
 case 'pause':tick();save();nav('home');break;case 'finish':finish();break;
 case 'kind':kindFilter=d.kind;render();break;case 'filter':filter=d.filter;render();break;
 case 'toggle':card(d.id).enabled=!card(d.id).enabled;save();render();break;
 case 'card':showCard(d.id);break;case 'one':start([d.id],'one');break;case 'speak':speak(d.id);break;
 case 'learn-done':{const it=item();it.learn=false;it.phase='practice';save();nav('session');break;}
 case 'method':item().method=d.method==='text'?'text':'self';if(d.method!=='text')item().selfMode=d.method;item().ready=false;save();render();break;
 case 'hint':item().hints=Math.min(2,item().hints+1);item().phase='practice';if(item().hints===2)mark(item().cardId);save();render();break;
 case 'reveal':if(item()&&!item().eventId){item().ready=true;item().revealed=true;mark(item().cardId,false);save();render();}break;
 case 'check':if(!C.norm(item().draft)){tell('先写下记得的文字，或点“这次还想不起”。');break;}record('match');break;
 case 'self-result':record(d.result);break;case 'unsure':record('unsure');break;case 'next':next();break;
 case 'note':{const e=s.events.find(x=>x.id===item()?.eventId);if(e){e.note=d.note;save();render();}break;}
 case 'undo':item().drawing.pop();redraw();save();break;
 case 'clear':modal('清空这张草稿？','<p>只清空当前未提交题的笔迹。</p><div class="actions">'+B('清空当前草稿','clear-ok')+B('保留','close','','primary')+'</div>');break;
 case 'clear-ok':item().drawing=[];save();close();redraw();break;
 case 'edit-tip':{const c=card(d.id);modal('留下自己的记忆线索','<div class="settings"><p>正文保持原样，以保留历史核对依据：'+esc(c.text)+'</p><label for="my-tip">我容易漏哪里？准备怎么记？</label><textarea id="my-tip" rows="4" maxlength="240">'+esc(c.tip)+'</textarea>'+B('保存线索','tip-ok',D(c.id),'primary')+'</div>');break;}
 case 'tip-ok':card(d.id).tip=$('my-tip').value.slice(0,240);save();close();tell('自己的线索，已经放进卡片。');break;
 case 'flag':modal('记录学校反馈','<p>只有老师的作业或默写确实标出这张卡需要再练时，才记录。记录会从今天重新安排回访。</p><div class="actions">'+B('确有学校反馈，记录','flag-ok',D(d.id),'primary')+B('取消','close')+'</div>');break;
 case 'flag-ok':s.flags.push({id:C.uid(),cardId:d.id,day:C.day(),at:Date.now()});save();close();tell('已标记，下次优先回访。');break;
 case 'prefs':s.prefs.name=$('nickname').value.trim().slice(0,12)||'小探索家';s.prefs.minutes=Number($('minutes').value);save();tell('已经记住这个节奏。');break;
 case 'review':{const e=s.events.find(x=>x.id===d.id);if(e){const c=card(e.cardId);mark(c.id);modal('回看这次发现','<p class="source-note">'+e.day+' · '+eventLabel(e)+'</p>'+studyHTML(c)+(e.method==='text'?diffHTML(c,e):drawingSVG(e.drawing))+'<p>自己的标记：'+esc(e.note||'暂无')+'</p>'+B('收好','close','','primary'));}break;}
 case 'export':backup();break;case 'export-summary':exportSummary();break;
 case 'backup-ok':s.backupAt=C.day();save();close();tell('备份日期已记好。');break;
 case 'import':$('import-file').click();break;
 case 'confirm-import':try{s=C.merge(s,importing);importing=null;recovery=null;if(s.active)s.active.queue.filter(it=>!it.eventId&&C.exposure(s,it.cardId)).forEach(it=>it.phase='practice');save();close();nav('records');tell('记录已合并，重复作答不会重复计数。');}catch(e){tell(e.message);}break;
 case 'offline':await offlineSetup();tell(offline?'离线资源已备好。':'请保持联网并从安装网址打开。');break;
 case 'persist':try{tell(await navigator.storage?.persist?.()?'已获得保留存储许可，仍建议每周备份。':'此浏览器未授予保留许可，使用不受影响，请每周备份。');}catch(e){tell('请每周导出备份，保存到“文件”。');}break;
 }
});
$('import-file').addEventListener('change',async e=>{
 const f=e.target.files[0];e.target.value='';if(!f)return;if(f.size>40*1024*1024){tell('请使用 40 MB 以下的星岛语文 JSON 备份。');return;}
 try{const x=JSON.parse(await f.text());C.validate(x,{backup:true});importing=x;const seen=new Set(s.events.map(e=>e.id));modal('合并学习记录','<p>文件中有 '+x.cards.length+' 张卡、'+x.events.length+' 次尝试，其中 '+x.events.filter(e=>!seen.has(e.id)).length+' 次是本机没有的。当前任务和本机设置保留。</p><div class="actions">'+B('合并记录','confirm-import','','primary')+B('取消','close')+'</div>');}catch(err){tell(err.message||'无法读取这个文件，请确认选择了语文备份。');}
});
document.addEventListener('visibilitychange',()=>{tick();if(document.hidden)save();lastTick=Date.now();});
window.addEventListener('pagehide',()=>{tick();save();});
setInterval(()=>{tick();if(s.active){save();if($('timer-label'))$('timer-label').textContent=Math.floor(s.active.seconds/60);if($('time-limit'))$('time-limit').hidden=s.active.seconds<(s.active.type==='weekly'?300:s.prefs.minutes*60);}},5000);
render();offlineSetup();
await activate();
try{pendingJob=sessionStorage.getItem(jobKey);if(pendingJob&&accessToken()){generating=true;generationMessage='正在取回上次生成的任务…';view='importView';render();await waitForGeneration(pendingJob);}}catch(e){generationError=e.message;}finally{generating=false;refreshGeneration();}
})();
</script></body></html>
